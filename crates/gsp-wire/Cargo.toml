[package]
name = "gsp-wire"
description = "Graph Sync Protocol v0 wire format: canonical CBOR ops, hybrid Ed25519 + ML-DSA-65 signatures, key log, sealed ops, wire frames. Engine-independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["ml-dsa"]
# ML-DSA-65 (FIPS 204) signing and verification. Without it the `ml-dsa`
# crate is not compiled, ML-DSA-65 keys cannot be created, and an ML-DSA-65
# key or signature is handled like any algorithm this build does not
# implement: `Unverifiable`, never valid, never invalid (WIRE-V0 section 2).
ml-dsa = ["dep:ml-dsa"]

[dependencies]
# CBOR tokenizer/emitter. We hand-write every encoder on top of it so the
# deterministic-encoding rules (RFC 8949 section 4.2) are ours, not serde's.
minicbor = { version = "2", default-features = false, features = [
  "alloc",
  "half",
] }
half = { version = "2", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = [
  "alloc",
  "fast",
  "zeroize",
] }
ml-dsa = { version = "0.1", default-features = false, optional = true, features = [
  "alloc",
  "zeroize",
] }
chacha20poly1305 = { version = "0.11", default-features = false, features = [
  "alloc",
  "zeroize",
] }
# `pure`: the default build script compiles C/asm and breaks iOS/Android here.
blake3 = { version = "1", default-features = false, features = ["pure"] }
sha3 = { version = "0.12", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
hex = "0.4"
