[package]
name = "gsp-sync"
description = "Graph Sync Protocol v0 replica: pairing, payload, merge, outbox. No I/O; engine-independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["ml-dsa"]
# Verify ops of authors that sign with ML-DSA-65 (hybrid authors). A replica
# itself always signs with Ed25519 only. Without the feature the `ml-dsa`
# crate is not compiled; a hybrid author's key log is then not accepted and
# its ops stay pending, as for any algorithm the build does not implement.
ml-dsa = ["gsp-wire/ml-dsa"]

[dependencies]
gsp-wire = { path = "../gsp-wire", version = "0.1.0", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
blake3 = { version = "1", default-features = false, features = ["pure"] }
