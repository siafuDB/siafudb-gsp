[workspace]
resolver = "2"
members = ["crates/gsp-wire", "crates/gsp-sync", "crates/gsp-relay"]

# GSP: the SiafuDB Graph Sync Protocol. Engine-independent: the SiafuDB
# adapter lives in siafuDB/siafudb.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/siafuDB/siafudb-gsp"
homepage = "https://siafudb.org"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
